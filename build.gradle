plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.1.37'
}

version = project.mod_version
group = project.mod_group_id
base { archivesName = "${project.mod_id}-${project.minecraft_version}-neoforge" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.aliyun.com/repository/public'; content { includeGroup 'com.github.promeg' } }
}
jarJar.enable()
runs {
    configureEach {
        workingDirectory = file('run')
        systemProperty 'forge.logging.console.level', 'info'
        modSource sourceSets.main
    }
    client {}
    server { argument '--nogui' }
}
dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"
    implementation 'com.github.promeg:tinypinyin:2.0.3'
    jarJar('com.github.promeg:tinypinyin:2.0.3') { version { strictly '[2.0.3,2.0.4)'; prefer '2.0.3' } }
    jarJar('org.ahocorasick:ahocorasick:0.3.0') { version { strictly '[0.3.0,0.3.1)'; prefer '0.3.0' } }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
tasks.named('processResources', ProcessResources).configure {
    def values = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_authors: mod_authors,
                  mod_license: mod_license, mod_description: mod_description,
                  loader_version_range: loader_version_range, neo_version_range: neo_version_range,
                  minecraft_version_range: minecraft_version_range]
    inputs.properties values
    filesMatching(['META-INF/neoforge.mods.toml']) { expand values }
}
tasks.named('jar', Jar).configure { archiveClassifier = 'slim' }
tasks.named('jarJar').configure { archiveClassifier = '' }
tasks.named('build').configure { dependsOn 'jarJar' }
def testRuntime = sourceSets.test.runtimeClasspath
def testBridge = new File(gradle.gradleUserHomeDir, "caches/skill-atlas-test-classpath/${Integer.toHexString(projectDir.absolutePath.hashCode())}/runtime.jar")
tasks.register('prepareTestClasspath') {
    dependsOn 'testClasses'
    inputs.files(testRuntime)
    outputs.file(testBridge)
    doLast {
        testBridge.parentFile.mkdirs()
        def manifest = new java.util.jar.Manifest()
        manifest.mainAttributes.putValue('Manifest-Version', '1.0')
        manifest.mainAttributes.putValue('Class-Path', testRuntime.files.collect { it.toURI().toASCIIString() }.join(' '))
        new java.util.jar.JarOutputStream(new FileOutputStream(testBridge), manifest).close()
    }
}
tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging { events 'failed', 'skipped' }
    dependsOn 'prepareTestClasspath'
    inputs.files(testRuntime).withPropertyName('actualRuntimeClasspath').withNormalizer(ClasspathNormalizer)
    classpath = files(testBridge)
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }